name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: npm test

      # Distribution is the tarball, served from qumge.com. Running the pack
      # here proves the package can be built; moving it into qumg
      # (public/downloads/qmg-code/) and bumping InstallController::VERSION is
      # a deliberate, reviewed step — the page's test fails until both agree.
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: qumge-code-tarball
          path: qumge-code-*.tgz
